<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="SobreImpréstimos — crédito sem burocracia">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e5a43"/>
      <stop offset="0.6" stop-color="#0b4536"/>
      <stop offset="1" stop-color="#082a21"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d7a5d"/>
      <stop offset="1" stop-color="#0a3528"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="300" fill="#d8f26b" opacity="0.07"/>
  <circle cx="1120" cy="360" r="180" fill="#d8f26b" opacity="0.06"/>

  <!-- texto -->
  <g font-family="'Manrope', 'Segoe UI', system-ui, sans-serif">
    <text x="80" y="120" font-size="16" font-weight="700" letter-spacing="3" fill="#d8f26b">EMPRÉSTIMO PESSOAL ONLINE</text>
    <text x="78" y="196" font-size="60" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Crédito sem burocracia.</text>
    <text x="80" y="256" font-size="27" font-weight="500" fill="#c7e6d5">De R$ 1.000 a R$ 20.000 direto na sua conta,</text>
    <text x="80" y="292" font-size="27" font-weight="500" fill="#c7e6d5">com PIX e cartão. Custo total na tela, antes de pedir.</text>
    <g transform="translate(80,330)">
      <rect width="214" height="52" rx="26" fill="#d8f26b"/>
      <text x="107" y="33" font-size="17" font-weight="800" fill="#0a2a21" text-anchor="middle">Simular agora</text>
    </g>
    <g transform="translate(310,330)" fill="#9fc9b4" font-size="14" font-weight="600">
      <text x="0" y="24">✓ Sem taxa antecipada</text>
      <text x="190" y="24">✓ Resposta rápida</text>
    </g>
  </g>

  <!-- cartão ilustrativo -->
  <g transform="translate(830,120) rotate(-8)">
    <rect width="300" height="188" rx="20" fill="url(#card)"/>
    <circle cx="250" cy="150" r="120" fill="#d8f26b" opacity="0.12"/>
    <rect x="28" y="34" width="46" height="34" rx="6" fill="#d8f26b" opacity="0.85"/>
    <text x="28" y="120" font-family="'Courier New', monospace" font-size="20" letter-spacing="3" fill="#eaf5ee">•••• •••• •••• 2048</text>
    <text x="28" y="156" font-family="'Manrope', sans-serif" font-size="12" letter-spacing="1.5" fill="#bfe0cd">SOBREIMPRÉSTIMOS</text>
    <text x="210" y="156" font-family="'Manrope', sans-serif" font-size="12" letter-spacing="1.5" fill="#bfe0cd">VIRTUAL</text>
  </g>
</svg>
